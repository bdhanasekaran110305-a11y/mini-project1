
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Digital Library</title>
    <link rel="stylesheet" href="../css/mem.css">
    <script src="../js/memb.js" defer></script>
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">Digital Library</h2>

        <div class="nav-links">
            <a href="../dashboard.html">Dashboard</a>
            <a href="books.html">Books</a>
            <a href="members.html" class="active">Members</a>
            <a href="issue-book.html">Issue Book</a>
            <a href="return-book.html">Return Book</a>
            <a href="reports.html">Reports</a>
            <a href="about.html">About</a>
            <a href="../login.html">Logout</a>
        </div>
    </nav>

    <main class="container">

        <section class="page-header">
            <div>
                <h1>Members</h1>
                <p>Manage all library members</p>
            </div>

            <button class="add-btn" id="addMemberBtn">
                + Add Member
            </button>
        </section>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Member Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="memberTableBody">
                    <!-- Members will appear here automatically -->
                </tbody>
            </table>

            <p id="emptyMessage" class="empty-message" hidden>
                No members found. Click + Add Member to add one.
            </p>
        </div>

    </main>

    <!-- Add/Edit Member Form -->
    <div class="modal" id="memberModal">
        <div class="modal-content">

            <button class="close-btn" id="closeModalBtn"
                    type="button" aria-label="Close">&times;</button>

            <h2 id="modalTitle">Add Member</h2>
            <p class="modal-subtitle">Enter the member details below</p>

            <form id="memberForm">

                <input type="hidden" id="editIndex" value="-1">

                <label for="memberName">Member Name</label>
                <input type="text" id="memberName"
                       placeholder="Enter member name"
                       minlength="2" maxlength="60" required>

                <label for="memberPhone">Phone Number</label>
                <input type="tel" id="memberPhone"
                       placeholder="Enter 10-digit phone number"
                       pattern="[0-9]{10}" maxlength="10" required>

                <label for="memberEmail">Email</label>
                <input type="email" id="memberEmail"
                       placeholder="Enter email address" required>

                <label for="memberAddress">Address</label>
                <input type="text" id="memberAddress"
                       placeholder="Enter address"
                       maxlength="150" required>

                <button type="submit" class="save-btn" id="saveBtn">
                    Save Member
                </button>

            </form>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>

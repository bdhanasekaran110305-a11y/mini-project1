<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books - Digital Library</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #06132e, #10245b);
            color: white;
            min-height: 100vh;
        }

        .navbar {
            min-height: 60px;
            padding: 10px 3.7%;
            background: #030d24;
            border-bottom: 1px solid #075985;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            color: #00e5ff;
            font-size: 25px;
            font-weight: 800;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: #dbeafe;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 11px;
            font-size: 13px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: linear-gradient(135deg, #0787ff, #4935ed);
            color: white;
        }

        .container {
            width: 94%;
            max-width: 1500px;
            margin: 38px auto;
        }

        .page-header {
            padding: 30px;
            border: 1px solid #075985;
            border-radius: 22px;
            background: linear-gradient(120deg, #0b2e64, #14265e);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, white, #22e6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            margin-top: 10px;
            color: #b9d3ff;
            font-size: 14px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: 0.25s;
        }

        .add-btn {
            background: linear-gradient(120deg, #00c6ff, #315bff);
            color: white;
            padding: 15px 24px;
            border-radius: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px #0787ff55;
        }

        .form-card {
            display: none;
            padding: 25px;
            margin-bottom: 25px;
            background: #0b1d40;
            border: 1px solid #1679b4;
            border-radius: 18px;
        }

        .form-card h2 {
            margin-bottom: 20px;
            color: #22e6ff;
            font-size: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #dbeafe;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #254777;
            background: #06132e;
            color: white;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 0 3px #00d9ff20;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        .save-btn,
        .cancel-btn {
            padding: 12px 22px;
            border-radius: 9px;
            color: white;
            font-weight: 600;
        }

        .save-btn {
            background: #2563eb;
        }

        .cancel-btn {
            background: #334155;
        }

        .table-card {
            border: 1px solid #075985;
            border-radius: 19px;
            overflow: hidden;
            background: #0a1c3f;
        }

        .table-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 22px;
        }

        .table-top h2 {
            font-size: 19px;
        }

        .table-top input {
            max-width: 300px;
            width: 100%;
            padding: 11px 15px;
            border-radius: 10px;
            border: 1px solid #254777;
            background: #06132e;
            color: white;
            outline: none;
            font-family: inherit;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(100deg, #087cff, #7225ce);
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid #203b66;
            font-size: 13px;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #132c54;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .action-btn {
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 12px;
            margin-right: 4px;
        }

        .edit-btn {
            background: #2563eb;
        }

        .delete-btn {
            background: #dc3545;
        }

        .empty-message {
            text-align: center;
            padding: 35px;
            color: #b9d3ff;
        }

        .message {
            display: none;
            padding: 13px 17px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #064e3b;
            color: #a7f3d0;
        }

        .book-count {
            color: #67e8f9;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                gap: 3px;
            }

            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page-header h1 {
                font-size: 34px;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
                margin: 22px auto;
            }

            .page-header {
                padding: 22px;
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 18px;
            }

            .table-top {
                padding: 16px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links a {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Digital Library</div>

        <div class="nav-links">
            <a href="../dashboard.html">Dashboard</a>
            <a href="books.html" class="active">Books</a>
            <a href="members.html">Members</a>
            <a href="issue-book.html">Issue Book</a>
            <a href="return-book.html">Return Book</a>
            <a href="reports.html">Reports</a>
            <a href="about.html">About</a>
            <a href="../login.html">Logout</a>
        </div>
    </nav>

    <main class="container">

        <section class="page-header">
            <div>
                <h1>Books</h1>
                <p>Manage and organize all your library books.</p>
            </div>

            <button class="add-btn" onclick="openBookForm()">
                + Add Book
            </button>
        </section>

        <div class="message" id="message"></div>

        <section class="form-card" id="bookFormCard">
            <h2 id="formTitle">Add New Book</h2>

            <form id="bookForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="bookId">Book ID *</label>
                        <input type="text" id="bookId"
                               placeholder="Example: B004" required>
                    </div>

                    <div class="form-group">
                        <label for="bookName">Book Name *</label>
                        <input type="text" id="bookName"
                               placeholder="Enter book name" required>
                    </div>

                    <div class="form-group">
                        <label for="author">Author *</label>
                        <input type="text" id="author"
                               placeholder="Enter author name" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <input type="text" id="category"
                               placeholder="Example: Programming" required>
                    </div>

                    <div class="form-group">
                        <label for="isbn">ISBN *</label>
                        <input type="text" id="isbn"
                               placeholder="Enter ISBN" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity"
                               min="1" step="1" value="1" required>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="save-btn" id="saveBtn">
                        Save Book
                    </button>

                    <button type="button" class="cancel-btn"
                            onclick="closeBookForm()">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="table-card">

            <div class="table-top">
                <h2>Book Collection</h2>

                <input type="search" id="searchBook"
                       placeholder="Search books..."
                       oninput="renderBooks()">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Book ID</th>
                            <th>Book Name</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>ISBN</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="bookTable"></tbody>
                </table>
            </div>

            <div class="empty-message" id="emptyMessage"
                 style="display:none;">
                No books found. Click + Add Book to add one.
            </div>

            <div class="table-top">
                <span class="book-count" id="bookCount">
                    Total books: 0
                </span>
            </div>

        </section>

    </main>

    <script>
        const STORAGE_KEY = "books";

        let books = [];
        let editIndex = -1;

        // Load books saved in browser storage
        function loadBooks() {
            try {
                const savedBooks = localStorage.getItem(STORAGE_KEY);
                const parsedBooks = savedBooks ? JSON.parse(savedBooks) : [];

                books = Array.isArray(parsedBooks) ? parsedBooks : [];
            } catch (error) {
                books = [];
                console.error("Unable to load books:", error);
            }

            renderBooks();
        }

        // Save books permanently in localStorage
        function saveBooksToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
        }

        // Support existing records that may use different property names
        function getBookName(book) {
            return book.bookName || book.name || book.title || "";
        }

        function getBookId(book) {
            return book.bookId || book.id || "";
        }

        function getQuantity(book) {
            const quantity = Number(book.quantity);
            return Number.isFinite(quantity) && quantity > 0
                ? quantity
                : 1;
        }

        // Display saved books in the table
        function renderBooks() {
            const table = document.getElementById("bookTable");
            const search = document.getElementById("searchBook")
                .value.trim().toLowerCase();

            table.innerHTML = "";

            const filteredBooks = books.filter(function(book) {
                return [
                    getBookId(book),
                    getBookName(book),
                    book.author || "",
                    book.category || "",
                    book.isbn || ""
                ].some(function(value) {
                    return String(value).toLowerCase().includes(search);
                });
            });

            filteredBooks.forEach(function(book, index) {
                const actualIndex = books.indexOf(book);
                const row = document.createElement("tr");

                const values = [
                    index + 1,
                    getBookId(book),
                    getBookName(book),
                    book.author || "",
                    book.category || "",
                    book.isbn || "",
                    getQuantity(book)
                ];

                values.forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "action-btn edit-btn";
                editButton.type = "button";
                editButton.addEventListener("click", function() {
                    editBook(actualIndex);
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "action-btn delete-btn";
                deleteButton.type = "button";
                deleteButton.addEventListener("click", function() {
                    deleteBook(actualIndex);
                });

                actionCell.append(editButton, deleteButton);
                row.appendChild(actionCell);
                table.appendChild(row);
            });

            document.getElementById("emptyMessage").style.display =
                filteredBooks.length === 0 ? "block" : "none";

            document.getElementById("bookCount").textContent =
                "Book records: " + books.length +
                " | Total copies: " +
                books.reduce(function(total, book) {
                    return total + getQuantity(book);
                }, 0);
        }

        // Open the add-book form
        function openBookForm() {
            editIndex = -1;

            document.getElementById("bookForm").reset();
            document.getElementById("formTitle").textContent =
                "Add New Book";
            document.getElementById("saveBtn").textContent =
                "Save Book";
            document.getElementById("bookId").disabled = false;
            document.getElementById("bookFormCard").style.display = "block";

            document.getElementById("bookFormCard").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        function closeBookForm() {
            document.getElementById("bookFormCard").style.display = "none";
            document.getElementById("bookForm").reset();
            editIndex = -1;
            document.getElementById("bookId").disabled = false;
        }

        // Add a new book or update an existing book
        document.getElementById("bookForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const bookId = document.getElementById("bookId")
                    .value.trim();
                const bookName = document.getElementById("bookName")
                    .value.trim();
                const author = document.getElementById("author")
                    .value.trim();
                const category = document.getElementById("category")
                    .value.trim();
                const isbn = document.getElementById("isbn")
                    .value.trim();
                const quantity = Number(
                    document.getElementById("quantity").value
                );

                if (!bookId || !bookName || !author ||
                    !category || !isbn) {
                    alert("Please fill in all required fields.");
                    return;
                }

                if (!Number.isInteger(quantity) || quantity < 1) {
                    alert("Quantity must be at least 1.");
                    return;
                }

                const duplicateId = books.some(function(book, index) {
                    return getBookId(book).toLowerCase() ===
                        bookId.toLowerCase() && index !== editIndex;
                });

                if (duplicateId) {
                    alert("This Book ID already exists. Enter a unique ID.");
                    return;
                }

                const duplicateIsbn = books.some(function(book, index) {
                    return String(book.isbn || "").toLowerCase() ===
                        isbn.toLowerCase() && index !== editIndex;
                });

                if (duplicateIsbn) {
                    alert("This ISBN already exists.");
                    return;
                }

                const book = {
                    bookId: bookId,
                    bookName: bookName,
                    author: author,
                    category: category,
                    isbn: isbn,
                    quantity: quantity
                };

                if (editIndex === -1) {
                    books.push(book);
                    showMessage("Book added and saved successfully!");
                } else {
                    books[editIndex] = book;
                    showMessage("Book updated successfully!");
                }

                try {
                    saveBooksToStorage();
                    renderBooks();
                    closeBookForm();
                } catch (error) {
                    alert("Unable to save. Browser storage may be full.");
                    loadBooks();
                }
            }
        );

        // Edit a book
        function editBook(index) {
            const book = books[index];

            editIndex = index;

            document.getElementById("bookId").value = getBookId(book);
            document.getElementById("bookName").value = getBookName(book);
            document.getElementById("author").value = book.author || "";
            document.getElementById("category").value = book.category || "";
            document.getElementById("isbn").value = book.isbn || "";
            document.getElementById("quantity").value = getQuantity(book);

            document.getElementById("bookId").disabled = true;
            document.getElementById("formTitle").textContent = "Edit Book";
            document.getElementById("saveBtn").textContent = "Update Book";
            document.getElementById("bookFormCard").style.display = "block";

            document.getElementById("bookFormCard").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        // Delete a book
        function deleteBook(index) {
            const name = getBookName(books[index]);

            if (!confirm('Are you sure you want to delete "' + name + '"?')) {
                return;
            }

            const oldBooks = [...books];
            books.splice(index, 1);

            try {
                saveBooksToStorage();
                renderBooks();
                showMessage("Book deleted successfully!");
            } catch (error) {
                books = oldBooks;
                renderBooks();
                alert("Unable to update browser storage.");
            }
        }

        // Show success message
        function showMessage(text) {
            const message = document.getElementById("message");

            message.textContent = text;
            message.style.display = "block";

            window.setTimeout(function() {
                message.style.display = "none";
            }, 3000);
        }

        // Refresh when another page changes the same storage key
        window.addEventListener("storage", function(event) {
            if (event.key === STORAGE_KEY) {
                loadBooks();
            }
        });

        // Start the page
        loadBooks();
    </script>

</body>
</html>
